[package]
name = "podium-studio"
version = "0.1.0"
description = "Podium Studio — Phase 2 desktop wrapper (not yet built/wired)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"

[lib]
name = "podium_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
